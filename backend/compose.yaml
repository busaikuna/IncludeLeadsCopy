services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: '${PGUSER:?configure PGUSER no .env}'
      POSTGRES_PASSWORD: '${PGPASSWORD:?configure PGPASSWORD no .env}'
      POSTGRES_DB: '${PGDATABASE:?configure PGDATABASE no .env}'
    ports:
      - '127.0.0.1:${PGPORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
